services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: hillwatch
      POSTGRES_USER: hillwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hillwatch"]
      interval: 5s
      retries: 12
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hillwatch:${POSTGRES_PASSWORD}@db/hillwatch
      DATA_DIR: /app/data
    command: ["python", "scripts/migrate.py"]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hillwatch:${POSTGRES_PASSWORD}@db/hillwatch
      DATA_DIR: /app/data
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
  # Worker is deliberately host-native for an existing Windows MATLAB license.
  # Use DATABASE_URL with localhost:5432 and the same ./data directory on the host.
volumes:
  pgdata:
